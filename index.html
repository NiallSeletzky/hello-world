<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iPad On-Screen Keyboard Demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "SF Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(180deg, #f8f9fb 0%, #dfe3ec 100%);
      }

      .device {
        width: min(1024px, 96vw);
        height: min(768px, 90vh);
        background: #fff;
        border-radius: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 10px solid #1c1c1e;
      }

      header {
        padding: 24px;
        text-align: center;
        font-size: 1.4rem;
        font-weight: 600;
        border-bottom: 1px solid rgba(28, 28, 30, 0.08);
      }

      .screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 24px;
        background: #f5f5f7;
        gap: 16px;
      }

      .screen label {
        font-size: 1rem;
        color: #3a3a3c;
      }

      .screen textarea {
        width: min(680px, 90%);
        height: 160px;
        padding: 16px;
        font-size: 1.2rem;
        border-radius: 18px;
        border: 1px solid rgba(60, 60, 67, 0.2);
        background: #fff;
        resize: none;
        outline: none;
      }

      .keyboard {
        padding: 24px;
        background: #d1d4da;
        display: grid;
        grid-template-rows: repeat(4, auto);
        gap: 12px;
        box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.08);
      }

      .row {
        display: grid;
        grid-auto-flow: column;
        gap: 10px;
        justify-content: center;
      }

      button.key {
        appearance: none;
        border: none;
        border-radius: 10px;
        min-width: 64px;
        padding: 16px 0;
        font-size: 1.2rem;
        font-weight: 500;
        background: #fff;
        color: #1c1c1e;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
        transition: transform 0.05s ease, box-shadow 0.05s ease;
      }

      button.key:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
      }

      .key-wide {
        min-width: 98px;
      }

      .key-space {
        min-width: 240px;
      }

      .key-action {
        background: linear-gradient(180deg, #3a86ff 0%, #2667ff 100%);
        color: white;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: min(680px, 90%);
        color: #636366;
      }

      .status-led {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #34c759;
        box-shadow: 0 0 0 4px rgba(52, 199, 89, 0.25);
      }

      @media (max-width: 900px) {
        .device {
          border-radius: 24px;
        }

        button.key {
          min-width: 48px;
          padding: 14px 0;
          font-size: 1rem;
        }

        .key-space {
          min-width: 160px;
        }
      }
    </style>
  </head>
  <body>
    <main class="device" role="application" aria-label="iPad on-screen keyboard demo">
      <header>On-Screen Keyboard</header>
      <section class="screen">
        <div class="status-row">
          <span>Notes</span>
          <span class="status-led" aria-hidden="true"></span>
        </div>
        <label for="output">Tap the keyboard to type</label>
        <textarea id="output" aria-live="polite" spellcheck="false"></textarea>
      </section>
      <section class="keyboard" role="group" aria-label="Keyboard">
        <div class="row" data-keys="Q W E R T Y U I O P"></div>
        <div class="row" data-keys="A S D F G H J K L"></div>
        <div class="row" data-keys="⇧ Z X C V B N M ⌫"></div>
        <div class="row" data-keys="123 🌐 space return"></div>
      </section>
    </main>

    <script>
      const textarea = document.getElementById("output");
      let isShifted = false;

      const rows = document.querySelectorAll(".row");
      rows.forEach((row) => {
        const keys = row.dataset.keys.split(" ");
        keys.forEach((label) => {
          const button = document.createElement("button");
          button.type = "button";
          button.classList.add("key");
          button.dataset.value = label;

          if (label === "space") {
            button.textContent = "";
            button.classList.add("key-space");
            button.setAttribute("aria-label", "Space");
          } else {
            button.textContent = label;
          }

          if (["⇧", "123", "🌐", "return", "⌫"].includes(label)) {
            button.classList.add("key-wide");
            button.setAttribute("aria-label", label === "⇧" ? "Shift" : label);
          }

          if (label === "return") {
            button.classList.add("key-action");
            button.textContent = "return";
            button.setAttribute("aria-label", "Return");
          }

          button.addEventListener("click", () => handleKeyPress(label));
          row.appendChild(button);
        });
      });

      function handleKeyPress(label) {
        switch (label) {
          case "⇧":
            isShifted = !isShifted;
            toggleShift();
            break;
          case "⌫":
            textarea.value = textarea.value.slice(0, -1);
            break;
          case "space":
            textarea.value += " ";
            break;
          case "return":
            textarea.value += "\n";
            break;
          case "123":
            showNumeric();
            break;
          default:
            insertCharacter(label);
        }

        textarea.focus();
      }

      function insertCharacter(label) {
        const char = isShifted ? label.toUpperCase() : label.toLowerCase();
        textarea.value += char;
        if (isShifted && label.length === 1 && /[a-z]/i.test(label)) {
          isShifted = false;
          toggleShift();
        }
      }

      function toggleShift() {
        document.querySelectorAll(".key").forEach((key) => {
          if (key.dataset.value && key.dataset.value.length === 1) {
            const letter = key.dataset.value;
            key.textContent = isShifted ? letter.toUpperCase() : letter.toLowerCase();
          }
          if (key.dataset.value === "space") {
            key.textContent = "";
          }
        });
      }

      function showNumeric() {
        alert("Numeric keyboard not implemented in this demo.");
      }

      // Initialize to lowercase labels
      toggleShift();
    </script>
  </body>
</html>
